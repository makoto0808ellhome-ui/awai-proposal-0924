</style></head><body data-revision="8c0223cd9119"><header><small>KARIJU / CHRISTMAS 2026 / 2026.10.25</small><h1>クリスマスチラシ<br>数量と価格を入れたチラシ</h1><p>数量と価格を入れ、フライドチキン単品を追加しました。店舗を選ぶと、連絡先が切り替わります。</p></header><main><div class="controls"><div class="group" aria-label="店舗を選ぶ"><button type="button" data-store="honten" aria-pressed="true">徳島本店</button><button type="button" data-store="itano" aria-pressed="false">TRIAL板野店</button></div><div class="group" aria-label="見た目を比べる"><button type="button" data-view="new" aria-pressed="true">価格・個数入り</button><button type="button" data-view="before" aria-pressed="false">価格を入れる前</button></div></div><figure><a class="image-link" id="image-link" target="_blank" rel="noopener"><img id="flyer" width="1588" height="2246" alt=""></a><figcaption id="caption" aria-live="polite"></figcaption></figure><p style="font-size:12px">画像をタップすると原寸で開きます。</p><div class="downloads"><a id="download" download>価格・個数入りの画像を保存</a><a id="pdf" target="_blank" rel="noopener">価格・個数入りのPDFを開く</a></div><p class="note">見た目を比べるための試作です。プレミアムセットの特典画像は仮のイメージです。</p><footer>確認版 8c0223cd9119 · 見た目を確認するためのページです。</footer></main><script>
const files={"honten":{"png":"xmas-festive-20261025-assets/honten-d421f66b003f.png","pdf":"xmas-festive-20261025-assets/honten-0f8e8e86441f.pdf","webp":"xmas-festive-20261025-assets/honten-054eae288b16.webp","before":"xmas-festive-20261025-assets/honten-before-99c2a8ae23e7.webp"},"itano":{"png":"xmas-festive-20261025-assets/itano-f03432f48cc2.png","pdf":"xmas-festive-20261025-assets/itano-2e26b992c9c9.pdf","webp":"xmas-festive-20261025-assets/itano-cea2395c6903.webp","before":"xmas-festive-20261025-assets/itano-before-6b472e3de3d3.webp"}},names={honten:'徳島本店',itano:'TRIAL板野店'};let store='honten',view='new';
