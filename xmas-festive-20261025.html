</style></head><body data-revision="c5d8fc827dc6"><header><small>KARIJU / CHRISTMAS 2026 / 2026.10.25</small><h1>クリスマスチラシ<br>リボンとオーナメントの案</h1><p>リボンやオーナメントを飾り、クリスマスの華やかさを強めました。店舗を選ぶと、連絡先が切り替わります。</p></header><main><div class="controls"><div class="group" aria-label="店舗を選ぶ"><button type="button" data-store="honten" aria-pressed="true">徳島本店</button><button type="button" data-store="itano" aria-pressed="false">TRIAL板野店</button></div><div class="group" aria-label="見た目を比べる"><button type="button" data-view="new" aria-pressed="true">飾りつけの案</button><button type="button" data-view="before" aria-pressed="false">放射線の案</button></div></div><figure><a class="image-link" id="image-link" target="_blank" rel="noopener"><img id="flyer" width="1588" height="2246" alt=""></a><figcaption id="caption" aria-live="polite"></figcaption></figure><p style="font-size:12px">画像をタップすると原寸で開きます。</p><div class="downloads"><a id="download" download>飾りつけの案の画像を保存</a><a id="pdf" target="_blank" rel="noopener">飾りつけの案のPDFを開く</a></div><p class="note">見た目を比べるための試作です。価格・個数、プレミアムセットの特典画像は仮です。</p><footer>確認版 c5d8fc827dc6 · 見た目を確認するためのページです。</footer></main><script>
const files={"honten":{"png":"xmas-festive-20261025-assets/honten-99c2a8ae23e7.png","pdf":"xmas-festive-20261025-assets/honten-5e242af366e8.pdf","webp":"xmas-festive-20261025-assets/honten-a4bddccf7fb0.webp","before":"xmas-festive-20261025-assets/honten-before-caf20438bf7d.webp"},"itano":{"png":"xmas-festive-20261025-assets/itano-6b472e3de3d3.png","pdf":"xmas-festive-20261025-assets/itano-479051843c19.pdf","webp":"xmas-festive-20261025-assets/itano-5ed3f64e9183.webp","before":"xmas-festive-20261025-assets/itano-before-b50c5b78d4ce.webp"}},names={honten:'徳島本店',itano:'TRIAL板野店'};let store='honten',view='new';
function update(){const f=files[store];document.getElementById('flyer').src=view==='new'?f.webp:f.before;document.getElementById('flyer').alt=names[store]+'｜'+(view==='new'?'飾りつけの案':'放射線の案');document.getElementById('image-link').href=view==='new'?f.png:f.before;document.getElementById('download').href=f.png;document.getElementById('download').download='クリスマスチラシ_飾りつけの案_'+names[store]+'.png';document.getElementById('pdf').href=f.pdf;document.getElementById('caption').textContent=names[store]+' / '+(view==='new'?'飾りつけの案':'放射線の案');document.querySelectorAll('[data-store]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.store===store)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}
document.querySelectorAll('[data-store]').forEach(b=>b.addEventListener('click',()=>{store=b.dataset.store;update()}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;update()}));update();
</script></body></html>
