<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>案4を太くしたもの</title><style>body{margin:0;background:#f4f1ec;color:#222;font:16px/1.7 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:20px}section{background:#fff;border-radius:10px;padding:14px;margin:0 0 18px}h2{font-size:18px;margin:0}h3{font-size:13px;color:#777;margin:12px 0 6px;font-weight:500}p{margin:4px 0 10px;font-size:14px}img{width:100%;display:block;border-radius:4px}img.s{width:150px}</style><main><h1>案4（Courgette）を太くしたもの</h1><section><h2>少し太く</h2><p>線の強さは控えめで、案4の軽さが残ります。</p><img src="xmas-title-b-20261101-assets/c3_top.jpg" alt="少し太くの見出し"><h3>チラシ全体を小さくしたとき</h3><img class="s" src="xmas-title-b-20261101-assets/c3_small.jpg" alt="少し太くの全体"></section><section><h2>中くらい（おすすめ）</h2><p>十分に太く、「e」「a」「s」の中のすき間もつぶれていません。</p><img src="xmas-title-b-20261101-assets/c45_top.jpg" alt="中くらい（おすすめ）の見出し"><h3>チラシ全体を小さくしたとき</h3><img class="s" src="xmas-title-b-20261101-assets/c45_small.jpg" alt="中くらい（おすすめ）の全体"></section><section><h2>かなり太く</h2><p>一番強い。ただ「e」「s」のすき間が狭くなり、丸く重たい印象です。</p><img src="xmas-title-b-20261101-assets/c6_top.jpg" alt="かなり太くの見出し"><h3>チラシ全体を小さくしたとき</h3><img class="s" src="xmas-title-b-20261101-assets/c6_small.jpg" alt="かなり太くの全体"></section></main></html>
