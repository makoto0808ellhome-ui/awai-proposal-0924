<h1>クリスマスチラシ｜器の大きさを調整</h1>
<p class="lead">白い器の写真を少し大きくし、赤い器と見た目の幅・底の位置をそろえました。</p>
<nav class="tabs" aria-label="店舗を選ぶ"><button type="button" data-store="honten" aria-pressed="true">徳島本店</button><button type="button" data-store="itano" aria-pressed="false">TRIAL板野店</button></nav>
<nav class="tabs" aria-label="表示する版を選ぶ"><button type="button" data-version="improved" aria-pressed="true">改善版</button><button type="button" data-version="before" aria-pressed="false">直す前</button></nav>
<div class="options"><input type="checkbox" id="mark"><label for="mark">仮の箇所を黄色で表示</label></div>
<figure><a id="zoom" target="_blank" rel="noopener"><img id="flyer" class="main-image" alt="徳島本店のクリスマスチラシ・紙面の改善版"></a><figcaption id="caption" aria-live="polite"></figcaption></figure>
<div class="downloads"><a id="original" target="_blank" rel="noopener">原寸PNGを開く</a><a id="png" download>画像を保存</a><a id="pdf" target="_blank" rel="noopener">A4確認用PDF</a></div>
<p class="hint">価格・個数・プレミアムセットの写真は仮です。PDFには印刷用の塗り足しを付けていません。</p>
<section><h2>今回直したところ</h2><ul><li>白い器の写真を約6％拡大し、赤い器と並べたときの大きさを整えました。</li><li>器の底の位置もそろえました。写真の質感は採用したままです。</li></ul></section>
<details><summary>直す前と改善版を見比べる</summary><div class="comparison"><figure><figcaption>直す前</figcaption><a id="before-zoom" target="_blank" rel="noopener"><img id="before" loading="lazy" alt="直す前の徳島本店のチラシ"></a></figure><figure><figcaption>改善版</figcaption><a id="after-zoom" target="_blank" rel="noopener"><img id="after" loading="lazy" alt="紙面を改善した徳島本店のチラシ"></a></figure></div></details>

<script>
